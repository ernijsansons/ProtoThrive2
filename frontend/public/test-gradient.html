<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gradient Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .gradient-test {
      min-height: 100vh;
      background: linear-gradient(135deg, #2563eb 0%, #9333ea 50%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #111;
      margin-bottom: 16px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="gradient-test">
    <div class="card">
      <h1>Gradient Test Page</h1>
      <p>If you can see a blue-to-purple gradient background, the CSS is working correctly.</p>
      <p style="margin-top: 16px;">This uses pure inline CSS with no Tailwind dependencies.</p>
    </div>
  </div>
</body>
</html>
