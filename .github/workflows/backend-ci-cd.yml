name: ProtoThrive Backend CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

env:
  NODE_VERSION: '20'
  WRANGLER_VERSION: '4.40.2'

jobs:
  lint-and-test:
    name: Lint & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run TypeScript compilation
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend
          name: backend-coverage

  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: lint-and-test
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate build artifacts
        run: |
          # Check if main files exist
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Main index.js not found in dist/"
            exit 1
          fi

          if [ ! -f "dist/durable-objects/RateLimiter.js" ]; then
            echo "❌ RateLimiter Durable Object not found"
            exit 1
          fi

          # Check if exports are correct
          if ! grep -q "export default app" dist/index.js; then
            echo "❌ Default app export not found"
            exit 1
          fi

          if ! grep -q "export { RateLimiter }" dist/index.js; then
            echo "❌ RateLimiter export not found"
            exit 1
          fi

          echo "✅ All build artifacts validated successfully"

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: backend/dist
          key: build-${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.ref == 'refs/heads/dev'
    environment: staging
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore build cache
        uses: actions/cache@v3
        with:
          path: backend/dist
          key: build-${{ github.sha }}

      - name: Build if cache miss
        run: npm run build

      - name: Deploy to Cloudflare Workers (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          workingDirectory: backend

      - name: Run post-deployment health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30

          # Health check (replace with actual staging URL)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://backend-thermo-staging.your-subdomain.workers.dev/health || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Staging deployment health check passed"
          else
            echo "❌ Staging deployment health check failed (HTTP $RESPONSE)"
            exit 1
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore build cache
        uses: actions/cache@v3
        with:
          path: backend/dist
          key: build-${{ github.sha }}

      - name: Build if cache miss
        run: npm run build

      - name: Run database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute protothrive-db --remote --file=migrations/003_update_schema.sql
          workingDirectory: backend

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          workingDirectory: backend

      - name: Run post-deployment health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30

          # Health check (replace with actual production URL)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.protothrive.com/health || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Production deployment health check passed"
          else
            echo "❌ Production deployment health check failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Create deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🚀 Production deployment successful!"
            echo "📊 Deployment URL: https://api.protothrive.com"
            echo "🔍 Health endpoint: https://api.protothrive.com/health"
          else
            echo "❌ Production deployment failed!"
            echo "🔧 Check logs and rollback if necessary"
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-validate
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Run dependency vulnerability check
        run: |
          # Check for known vulnerabilities
          npx audit-ci --moderate

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./backend
          base: main
          head: HEAD
          extra_args: --debug --only-verified