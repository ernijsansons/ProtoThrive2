# Enterprise-grade Docker Compose for ProtoThrive
# Implements security, monitoring, and scalability best practices

version: '3.8'

# =============================================================================
# Networks Configuration
# =============================================================================
networks:
  protothrive-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
    labels:
      - "com.protothrive.network=frontend"
      - "com.protothrive.security=isolated"

  protothrive-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24
    labels:
      - "com.protothrive.network=backend"
      - "com.protothrive.security=isolated"

  protothrive-database:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.3.0/24
    labels:
      - "com.protothrive.network=database"
      - "com.protothrive.security=isolated"

  protothrive-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.4.0/24
    labels:
      - "com.protothrive.network=monitoring"
      - "com.protothrive.security=isolated"

# =============================================================================
# Volumes Configuration
# =============================================================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/docker/volumes/protothrive_postgres_data
    labels:
      - "com.protothrive.volume=postgres"
      - "com.protothrive.backup=required"

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/docker/volumes/protothrive_redis_data
    labels:
      - "com.protothrive.volume=redis"
      - "com.protothrive.backup=required"

  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/docker/volumes/protothrive_prometheus_data
    labels:
      - "com.protothrive.volume=prometheus"
      - "com.protothrive.backup=optional"

  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/docker/volumes/protothrive_grafana_data
    labels:
      - "com.protothrive.volume=grafana"
      - "com.protothrive.backup=optional"

  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/docker/volumes/protothrive_elasticsearch_data
    labels:
      - "com.protothrive.volume=elasticsearch"
      - "com.protothrive.backup=required"

  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/docker/volumes/protothrive_minio_data
    labels:
      - "com.protothrive.volume=minio"
      - "com.protothrive.backup=required"

  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/docker/volumes/protothrive_nginx_logs
    labels:
      - "com.protothrive.volume=nginx"
      - "com.protothrive.backup=optional"

# =============================================================================
# Services Configuration
# =============================================================================
services:
  # =============================================================================
  # Frontend Service - Enterprise Configuration
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.enterprise
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8787}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://backend:8787}
        NEXT_PUBLIC_SPLINE_SCENE: ${NEXT_PUBLIC_SPLINE_SCENE}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NODE_ENV: ${NODE_ENV:-production}
    image: protothrive-frontend:enterprise
    container_name: protothrive-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - protothrive-frontend
      - protothrive-backend
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    labels:
      - "com.protothrive.service=frontend"
      - "com.protothrive.tier=web"
      - "com.protothrive.monitoring=enabled"
      - "com.protothrive.security=hardened"

  # =============================================================================
  # Backend Service - Enterprise Configuration
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.enterprise
      target: runner
      args:
        CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
        CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
        ENVIRONMENT: ${ENVIRONMENT:-production}
    image: protothrive-backend:enterprise
    container_name: protothrive-backend
    ports:
      - "${BACKEND_PORT:-8787}:8787"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://protothrive:${POSTGRES_PASSWORD}@postgres:5432/protothrive
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    networks:
      - protothrive-backend
      - protothrive-database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    labels:
      - "com.protothrive.service=backend"
      - "com.protothrive.tier=api"
      - "com.protothrive.monitoring=enabled"
      - "com.protothrive.security=hardened"

  # =============================================================================
  # PostgreSQL Database - Enterprise Configuration
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: protothrive-postgres
    environment:
      POSTGRES_DB: protothrive
      POSTGRES_USER: protothrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/backups:/backups:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - protothrive-database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protothrive -d protothrive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=postgres"
      - "com.protothrive.tier=database"
      - "com.protothrive.monitoring=enabled"
      - "com.protothrive.backup=required"

  # =============================================================================
  # Redis Cache - Enterprise Configuration
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: protothrive-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - protothrive-database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=redis"
      - "com.protothrive.tier=cache"
      - "com.protothrive.monitoring=enabled"

  # =============================================================================
  # Nginx Reverse Proxy - Enterprise Configuration
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: protothrive-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - protothrive-frontend
      - protothrive-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=nginx"
      - "com.protothrive.tier=proxy"
      - "com.protothrive.monitoring=enabled"

  # =============================================================================
  # Prometheus Monitoring - Enterprise Configuration
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: protothrive-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - protothrive-monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=prometheus"
      - "com.protothrive.tier=monitoring"
      - "com.protothrive.monitoring=enabled"

  # =============================================================================
  # Grafana Dashboard - Enterprise Configuration
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: protothrive-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - protothrive-monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=grafana"
      - "com.protothrive.tier=monitoring"
      - "com.protothrive.monitoring=enabled"

  # =============================================================================
  # Elasticsearch for Logging - Enterprise Configuration
  # =============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: protothrive-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - protothrive-monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    labels:
      - "com.protothrive.service=elasticsearch"
      - "com.protothrive.tier=logging"
      - "com.protothrive.monitoring=enabled"

  # =============================================================================
  # Kibana for Log Analysis - Enterprise Configuration
  # =============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: protothrive-kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - protothrive-monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=kibana"
      - "com.protothrive.tier=logging"
      - "com.protothrive.monitoring=enabled"

  # =============================================================================
  # MinIO for Object Storage - Enterprise Configuration
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: protothrive-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - protothrive-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=minio"
      - "com.protothrive.tier=storage"
      - "com.protothrive.monitoring=enabled"

  # =============================================================================
  # Jaeger for Distributed Tracing - Enterprise Configuration
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: protothrive-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_AGENT_PORT:-14268}:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - protothrive-monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=jaeger"
      - "com.protothrive.tier=tracing"
      - "com.protothrive.monitoring=enabled"

  # =============================================================================
  # Mailhog for Email Testing - Enterprise Configuration
  # =============================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: protothrive-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - protothrive-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.protothrive.service=mailhog"
      - "com.protothrive.tier=testing"
      - "com.protothrive.monitoring=enabled"
