## 🚨 Rollback Strategy

```bash
#!/bin/bash
# rollback.sh

PREVIOUS_VERSION=$1
ENVIRONMENT=$2

echo "🔄 Rolling back to version $PREVIOUS_VERSION on $ENVIRONMENT"

# Cloudflare Pages rollback
wrangler pages rollback --project-name=protothrive-frontend --version=$PREVIOUS_VERSION

# Clear CDN cache
curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
  -H "Content-Type: application/json" \
  --data '{"purge_everything":true}'

# Notify team
curl -X POST $SLACK_WEBHOOK_URL \
  -H 'Content-Type: application/json' \
  -d "{\"text\":\"⚠️ Rolled back to version $PREVIOUS_VERSION on $ENVIRONMENT\"}"

# Run smoke tests
npm run test:smoke

echo "✅ Rollback complete"
```

