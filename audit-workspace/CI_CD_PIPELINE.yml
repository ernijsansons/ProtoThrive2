    applicationId: process.env.DD_APPLICATION_ID,
    clientToken: process.env.DD_CLIENT_TOKEN,
    site: 'datadoghq.com',
    service: 'protothrive-frontend',
    env: process.env.NODE_ENV,
    version: process.env.npm_package_version,
