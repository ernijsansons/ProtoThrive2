    // Alert if error rate > 1%
    errorRate: {
      threshold: 0.01,
      window: '5m',
      severity: 'warning'
    },
    
    // Alert if P95 response time > 3s
    responseTime: {
      metric: 'p95',
      threshold: 3000,
      window: '5m',
      severity: 'critical'
    },
    
    // Alert if Apdex < 0.8
    apdex: {
      threshold: 0.8,
      window: '5m',
      severity: 'warning'
    }
  }
};
