## 🛠️ Custom Scripts

### Performance Budget Checker

```javascript
// scripts/check-performance-budget.js
const fs = require('fs');
const path = require('path');

const BUDGETS = {
  js: 250 * 1024,      // 250KB
  css: 100 * 1024,     // 100KB
  images: 500 * 1024,  // 500KB per image
  total: 1000 * 1024   // 1MB total
};

function checkBudget(distPath) {
  const files = fs.readdirSync(distPath, { withFileTypes: true });
  const results = {
    js: 0,
    css: 0,
    images: [],
    total: 0,
    violations: []
  };

  files.forEach(file => {
    if (file.isFile()) {
      const filePath = path.join(distPath, file.name);
      const stats = fs.statSync(filePath);
      const size = stats.size;
      
      results.total += size;
      
      if (file.name.endsWith('.js')) {
        results.js += size;
      } else if (file.name.endsWith('.css')) {
        results.css += size;
      } else if (/\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)) {
        results.images.push({ name: file.name, size });
        if (size > BUDGETS.images) {
          results.violations.push(`Image ${file.name}: ${(size / 1024).toFixed(2)}KB exceeds budget`);
        }
      }
    }
  });

  // Check violations
  if (results.js > BUDGETS.js) {
    results.violations.push(`JS bundle: ${(results.js / 1024).toFixed(2)}KB exceeds budget`);
  }
  if (results.css > BUDGETS.css) {
    results.violations.push(`CSS bundle: ${(results.css / 1024).toFixed(2)}KB exceeds budget`);
  }
  if (results.total > BUDGETS.total) {
    results.violations.push(`Total size: ${(results.total / 1024).toFixed(2)}KB exceeds budget`);
  }

  // Report results
  console.log('📊 Performance Budget Check Results:');
  console.log(`  JS: ${(results.js / 1024).toFixed(2)}KB / ${(BUDGETS.js / 1024)}KB`);
  console.log(`  CSS: ${(results.css / 1024).toFixed(2)}KB / ${(BUDGETS.css / 1024)}KB`);
  console.log(`  Total: ${(results.total / 1024).toFixed(2)}KB / ${(BUDGETS.total / 1024)}KB`);
  
  if (results.violations.length > 0) {
    console.error('\n❌ Budget violations:');
    results.violations.forEach(v => console.error(`  - ${v}`));
    process.exit(1);
  } else {
    console.log('\n✅ All budgets passed!');
  }
}

checkBudget('./dist');
```

### Security Headers Checker

```javascript
// scripts/check-security-headers.js
const https = require('https');

const REQUIRED_HEADERS = {
  'content-security-policy': /default-src/,
  'x-frame-options': /DENY|SAMEORIGIN/,
  'x-content-type-options': /nosniff/,
  'strict-transport-security': /max-age=/,
  'referrer-policy': /strict-origin|no-referrer/,
  'permissions-policy': /geolocation/
};

function checkHeaders(url) {
  return new Promise((resolve, reject) => {
    https.get(url, (res) => {
      const headers = res.headers;
      const results = {
        passed: [],
        failed: [],
        score: 0
      };

      Object.entries(REQUIRED_HEADERS).forEach(([header, pattern]) => {
        const value = headers[header.toLowerCase()];
        if (value && pattern.test(value)) {
          results.passed.push(`✅ ${header}: ${value}`);
          results.score++;
        } else {
          results.failed.push(`❌ ${header}: ${value || 'MISSING'}`);
        }
      });

      const totalHeaders = Object.keys(REQUIRED_HEADERS).length;
      const percentage = (results.score / totalHeaders * 100).toFixed(0);

      console.log(`\n🔒 Security Headers Check for ${url}`);
      console.log(`Score: ${results.score}/${totalHeaders} (${percentage}%)\n`);
      
      if (results.passed.length > 0) {
        console.log('Passed:');
        results.passed.forEach(p => console.log(`  ${p}`));
      }
      
      if (results.failed.length > 0) {
        console.log('\nFailed:');
        results.failed.forEach(f => console.log(`  ${f}`));
      }

      if (results.score < totalHeaders) {
        reject(new Error('Security headers check failed'));
      } else {
        resolve(results);
      }
    }).on('error', reject);
  });
}

checkHeaders('https://protothrive-frontend.pages.dev')
  .catch(err => {
    console.error('\n❌ Security check failed:', err.message);
    process.exit(1);
  });
```

### Web Vitals Monitor

```javascript
// scripts/monitor-web-vitals.js
const puppeteer = require('puppeteer');

async function measureWebVitals(url) {
  const browser = await puppeteer.launch({ headless: true });
  const page = await browser.newPage();

  // Inject web-vitals library
  await page.evaluateOnNewDocument(() => {
    window.webVitals = [];
    
    // Mock web-vitals functions
    window.measureCLS = () => {
      let cls = 0;
      new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) {
          if (!entry.hadRecentInput) {
            cls += entry.value;
          }
        }
        window.webVitals.push({ name: 'CLS', value: cls });
      }).observe({ type: 'layout-shift', buffered: true });
    };
    
    window.measureLCP = () => {
      new PerformanceObserver((list) => {
        const entries = list.getEntries();
        const lastEntry = entries[entries.length - 1];
        window.webVitals.push({ name: 'LCP', value: lastEntry.startTime });
      }).observe({ type: 'largest-contentful-paint', buffered: true });
    };
    
    window.measureFID = () => {
      new PerformanceObserver((list) => {
        const firstInput = list.getEntries()[0];
        const fid = firstInput.processingStart - firstInput.startTime;
        window.webVitals.push({ name: 'FID', value: fid });
      }).observe({ type: 'first-input', buffered: true });
    };
  });

  await page.goto(url, { waitUntil: 'networkidle2' });
  
  // Wait for metrics
  await page.waitForTimeout(5000);
  
  // Collect metrics
  const metrics = await page.evaluate(() => {
    const navigation = performance.getEntriesByType('navigation')[0];
    const paint = performance.getEntriesByType('paint');
    
    return {
      TTFB: navigation.responseStart - navigation.requestStart,
      FCP: paint.find(p => p.name === 'first-contentful-paint')?.startTime || 0,
      DCL: navigation.domContentLoadedEventEnd - navigation.fetchStart,
      Load: navigation.loadEventEnd - navigation.fetchStart,
      WebVitals: window.webVitals
    };
  });

  await browser.close();
  
  // Report results
  console.log('\n📊 Core Web Vitals Report');
  console.log('========================');
  console.log(`URL: ${url}`);
  console.log(`\nMetrics:`);
  console.log(`  TTFB: ${metrics.TTFB.toFixed(2)}ms ${metrics.TTFB < 600 ? '✅' : '❌'}`);
  console.log(`  FCP: ${metrics.FCP.toFixed(2)}ms ${metrics.FCP < 1800 ? '✅' : '❌'}`);
  console.log(`  DCL: ${metrics.DCL.toFixed(2)}ms`);
  console.log(`  Load: ${metrics.Load.toFixed(2)}ms`);
  
  if (metrics.WebVitals.length > 0) {
    console.log('\nWeb Vitals:');
    metrics.WebVitals.forEach(vital => {
      let threshold, status;
      switch (vital.name) {
        case 'CLS':
          threshold = 0.1;
          status = vital.value < threshold ? '✅' : '❌';
          console.log(`  ${vital.name}: ${vital.value.toFixed(3)} ${status}`);
          break;
        case 'LCP':
          threshold = 2500;
          status = vital.value < threshold ? '✅' : '❌';
          console.log(`  ${vital.name}: ${vital.value.toFixed(2)}ms ${status}`);
          break;
        case 'FID':
          threshold = 100;
          status = vital.value < threshold ? '✅' : '❌';
          console.log(`  ${vital.name}: ${vital.value.toFixed(2)}ms ${status}`);
          break;
      }
    });
  }
  
  return metrics;
}

measureWebVitals('https://protothrive-frontend.pages.dev')
  .catch(console.error);
```

