# Ref: CLAUDE.md Terminal 1 Phase 1 - Workers Configuration
# Thermonuclear Cloudflare Workers Configuration for ProtoThrive

name = "backend-thermo"
main = "dist/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Account and route configuration
# IMPORTANT: Set via environment variable or wrangler login
# account_id will be read from CLOUDFLARE_ACCOUNT_ID env var
workers_dev = true

# Environment variables
[vars]
ENVIRONMENT = "development"
SERVICE_NAME = "protothrive-backend"
# JWT_SECRET set via wrangler secret put JWT_SECRET

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "protothrive-db"
database_id = "0b6970f4-c6ca-4245-aabf-98fa2d4f28a8"

# KV Namespace binding
[[kv_namespaces]]
binding = "KV_STORE"
id = "ec3183e7b4e94442b3f99b4d2f4b083e"
preview_id = "ec3183e7b4e94442b3f99b4d2f4b083e"

# Durable Object bindings (temporarily disabled for deployment)
# [[durable_objects.bindings]]
# name = "RATE_LIMITER"
# class_name = "RateLimiter"
# script_name = "backend-thermo"

# Build configuration
[build]
command = "npm run build"

# Development environment
[env.development]
name = "backend-thermo-dev"
vars = { ENVIRONMENT = "development" }

# Staging environment
[env.staging]
name = "backend-thermo-staging"
vars = { ENVIRONMENT = "staging" }

# Production environment
[env.production]
name = "backend-thermo-prod"
route = "api.protothrive.com/*"

[env.production.vars]
ENVIRONMENT = "production"
SERVICE_NAME = "protothrive-backend-prod"
LOG_LEVEL = "info"
RATE_LIMIT_REQUESTS_PER_MINUTE = "100"
RATE_LIMIT_REQUESTS_PER_SECOND = "10"
CACHE_TTL_SECONDS = "3600"
MAX_UPLOAD_SIZE_MB = "10"
JWT_EXPIRY_SECONDS = "900"
REFRESH_TOKEN_EXPIRY_SECONDS = "604800"
BCRYPT_ROUNDS = "12"
CORS_ORIGIN = "https://protothrive.com"
ALLOWED_ORIGINS = "https://protothrive.com,https://www.protothrive.com"
API_URL = "https://api.protothrive.com"
FRONTEND_URL = "https://protothrive.com"
WEBSOCKET_URL = "wss://ws.protothrive.com"
ENABLE_BETA_FEATURES = "false"
ENABLE_PERFORMANCE_MONITORING = "true"
AUTO_DEPLOY_ENABLED = "false"
ENABLE_RATE_LIMITING = "true"
ENABLE_CACHING = "true"

# Production D1 Database
[[env.production.d1_databases]]
binding = "DB"
database_name = "protothrive-db"
database_id = "0b6970f4-c6ca-4245-aabf-98fa2d4f28a8"

# Production KV Namespace
[[env.production.kv_namespaces]]
binding = "KV_STORE"
id = "ec3183e7b4e94442b3f99b4d2f4b083e"

# Production Durable Objects (temporarily disabled for initial deployment)
# [[env.production.durable_objects.bindings]]
# name = "RATE_LIMITER"
# class_name = "RateLimiter"
# script_name = "backend-thermo-prod"

# WebSocket Manager temporarily disabled
# [[env.production.durable_objects.bindings]]
# name = "WEBSOCKET_MANAGER"
# class_name = "WebSocketManager"
# script_name = "backend-thermo-prod"

# Production Analytics Engine (commented until enabled in dashboard)
# [[env.production.analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "protothrive-analytics-prod"

# Performance configuration (commented for free plan)
# [limits]
# cpu_ms = 50

# Node compatibility is handled via compatibility_flags