# SonarCloud Configuration for ProtoThrive Backend
# Fortune 50 level code quality standards

sonar.projectKey=protothrive_backend
sonar.organization=protothrive

# Project metadata
sonar.projectName=ProtoThrive Backend
sonar.projectVersion=2.0.0

# Source and test directories
sonar.sources=src
sonar.tests=src/__tests__
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,**/dist/**,**/.wrangler/**,**/coverage/**

# Coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts,**/migrations/**

# Test execution reports
sonar.testExecutionReportPaths=coverage/test-report.xml

# Code quality gates (Fortune 50 standards)
sonar.qualitygate.wait=true

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Duplications
sonar.cpd.exclusions=**/__tests__/**,**/migrations/**

# Issues
sonar.issue.ignore.multicriteria=e1,e2,e3

# e1: Ignore TODO comments in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/__tests__/**

# e2: Ignore console.log in development utilities
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2589
sonar.issue.ignore.multicriteria.e2.resourceKey=**/utils/migrations.ts

# e3: Ignore complexity in migration files
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/migrations/**

# Security hotspot review
sonar.security.review.rating=A

# Maintainability rating target
sonar.maintainability.rating=A

# Reliability rating target
sonar.reliability.rating=A

# Security rating target
sonar.security.rating=A

# Technical debt ratio target
sonar.tech_debt.hours_in_day=8
sonar.tech_debt.rating_grid=0.05,0.1,0.2,0.5

# Code coverage thresholds
# Fortune 50 standard: 95% minimum coverage
sonar.coverage.overall.target=95
sonar.coverage.line.target=95
sonar.coverage.branch.target=95

# Code smells density threshold
sonar.code_smells_density.target=5

# Duplicated lines density threshold
sonar.duplicated_lines_density.target=3

# Complexity thresholds
sonar.complexity.function=15
sonar.complexity.file=200

# Lines of code thresholds
sonar.max_lines_per_file=500
sonar.max_lines_per_function=50

# Comment density (20-30% is ideal)
sonar.comment_lines_density.target=25

# Branch analysis
sonar.branch.name=${GITHUB_HEAD_REF}
sonar.pullrequest.key=${GITHUB_PR_NUMBER}
sonar.pullrequest.branch=${GITHUB_HEAD_REF}
sonar.pullrequest.base=${GITHUB_BASE_REF}

# Links
sonar.links.homepage=https://protothrive.com
sonar.links.ci=https://github.com/protothrive/backend/actions
sonar.links.issue=https://github.com/protothrive/backend/issues
sonar.links.scm=https://github.com/protothrive/backend
