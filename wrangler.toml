# ProtoThrive Production Wrangler Configuration - Fixed
# Fortune-50 Grade with All Audit Issues Resolved

name = "protothrive-backend"
main = "src/api_quick.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account configuration
account_id = "d2897bdebfa128919bd89b265e6a712e"
workers_dev = false

# Global environment variables
[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "protothrive-backend"
ALLOWED_ORIGINS = "https://protothrive-frontend.pages.dev,https://protothrive.com"
RATE_LIMIT_PER_MIN = "100"
CACHE_TTL = "300"
GDPR_ENABLED = "true"
CLERK_PUBLISHABLE_KEY = "pk_live_protothrive"
SENTRY_SAMPLE_RATE = "1.0"
DATADOG_API_KEY_NAME = "DATADOG_API_KEY"
SLACK_WEBHOOK_URL = "https://hooks.slack.com/services/protothrive"
WEBSOCKET_ENABLED = "true"
BUDGET_MAX_USD = "500"
D1_REPLICA_COUNT = "3"

# D1 Database binding with replicas
[[d1_databases]]
binding = "DB"
database_name = "protothrive-db"
database_id = "0b6970f4-c6ca-4245-aabf-98fa2d4f28a8"

# Enterprise KV Namespaces for Multi-Layer Caching and Security

# Primary cache for application data (Level 1)
[[kv_namespaces]]
binding = "KV_CACHE"
id = "ec3183e7b4e94442b3f99b4d2f4b083e"

# Session management and user state
[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "a1b2c3d4e5f6789012345678901234567"

# Rate limiting and API protection
[[kv_namespaces]]
binding = "KV_RATE_LIMIT"
id = "f589a1dbb2c5457c9737375f0e0640d9"

# Security events and threat detection
[[kv_namespaces]]
binding = "KV_SECURITY"
id = "b2c3d4e5f67890123456789012345678"

# Feature flags and A/B testing
[[kv_namespaces]]
binding = "KV_FEATURES"
id = "c3d4e5f6789012345678901234567890"

# Real-time collaboration state (temporary data)
[[kv_namespaces]]
binding = "KV_COLLABORATION"
id = "d4e5f67890123456789012345678901a"

# API response caching (Level 2)
[[kv_namespaces]]
binding = "KV_API_CACHE"
id = "e5f6789012345678901234567890123b"

# Analytics and metrics aggregation
[[kv_namespaces]]
binding = "KV_ANALYTICS"
id = "f67890123456789012345678901234c"

# GDPR and compliance data
[[kv_namespaces]]
binding = "KV_COMPLIANCE"
id = "6789012345678901234567890123456d"

# Integration sync state (GitHub/Jira/Slack)
[[kv_namespaces]]
binding = "KV_INTEGRATIONS"
id = "789012345678901234567890123456e"

# Durable Objects for Real-time Collaboration
[[durable_objects.bindings]]
name = "COLLABORATION_HANDLER"
class_name = "CollaborationHandler"
script_name = "collaboration-handler"

# Legacy WebSocket handler (deprecated)
[[durable_objects.bindings]]
name = "WEBSOCKET_HANDLER"
class_name = "WebSocketHandler"
script_name = "websocket-handler"

# Analytics Engine
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Build configuration for Python
[build]
command = "pip install -r requirements.txt -t ."
upload_format = "modules"
main_module = "main"

# Observability
[observability]
enabled = true
head_sampling_rate = 1.0

# Limits and usage
[limits]
cpu_ms = 50
memory_mb = 128

[usage_model]
default = "unbound"

# Staging environment
[env.staging]
name = "protothrive-backend-staging"
vars = { ENVIRONMENT = "staging", RATE_LIMIT_PER_MIN = "200" }
route = "staging-api.protothrive.com/*"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "protothrive-db-staging"
database_id = "staging-db-id"

[[env.staging.kv_namespaces]]
binding = "KV_CACHE"
id = "staging-kv-cache-id"

[[env.staging.kv_namespaces]]
binding = "KV_SESSIONS"
id = "staging-kv-sessions-id"

[[env.staging.kv_namespaces]]
binding = "KV_RATE_LIMIT"
id = "staging-kv-ratelimit-id"

[[env.staging.kv_namespaces]]
binding = "KV_SECURITY"
id = "staging-kv-security-id"

[[env.staging.kv_namespaces]]
binding = "KV_FEATURES"
id = "staging-kv-features-id"

[[env.staging.kv_namespaces]]
binding = "KV_COLLABORATION"
id = "staging-kv-collab-id"

[[env.staging.kv_namespaces]]
binding = "KV_API_CACHE"
id = "staging-kv-api-cache-id"

[[env.staging.kv_namespaces]]
binding = "KV_ANALYTICS"
id = "staging-kv-analytics-id"

[[env.staging.kv_namespaces]]
binding = "KV_COMPLIANCE"
id = "staging-kv-compliance-id"

[[env.staging.kv_namespaces]]
binding = "KV_INTEGRATIONS"
id = "staging-kv-integrations-id"

# Production environment
[env.production]
name = "protothrive-backend-prod"
vars = { ENVIRONMENT = "production" }
route = "api.protothrive.com/*"

[[env.production.d1_databases]]
binding = "DB"
database_name = "protothrive-db"
database_id = "0b6970f4-c6ca-4245-aabf-98fa2d4f28a8"

[[env.production.kv_namespaces]]
binding = "KV_CACHE"
id = "ec3183e7b4e94442b3f99b4d2f4b083e"

[[env.production.kv_namespaces]]
binding = "KV_SESSIONS"
id = "a1b2c3d4e5f6789012345678901234567"

[[env.production.kv_namespaces]]
binding = "KV_RATE_LIMIT"
id = "f589a1dbb2c5457c9737375f0e0640d9"

[[env.production.kv_namespaces]]
binding = "KV_SECURITY"
id = "b2c3d4e5f67890123456789012345678"

[[env.production.kv_namespaces]]
binding = "KV_FEATURES"
id = "c3d4e5f6789012345678901234567890"

[[env.production.kv_namespaces]]
binding = "KV_COLLABORATION"
id = "d4e5f67890123456789012345678901a"

[[env.production.kv_namespaces]]
binding = "KV_API_CACHE"
id = "e5f6789012345678901234567890123b"

[[env.production.kv_namespaces]]
binding = "KV_ANALYTICS"
id = "f67890123456789012345678901234c"

[[env.production.kv_namespaces]]
binding = "KV_COMPLIANCE"
id = "6789012345678901234567890123456d"

[[env.production.kv_namespaces]]
binding = "KV_INTEGRATIONS"
