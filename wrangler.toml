name = "proto-thrive-thermonuclear"
main = "backend/src/index.ts"
compatibility_date = "2024-01-01"

[env.development]
name = "proto-thrive-dev"
vars = { ENVIRONMENT = "development" }

[env.production]
name = "proto-thrive-prod"
vars = { ENVIRONMENT = "production" }

[[d1_databases]]
binding = "DB"
database_name = "proto-thrive-db"
database_id = "mock_d1_thermo"

[[kv_namespaces]]
binding = "KV"
id = "mock_kv_thermo"

[vars]
CLAUDE_API_KEY = "sk-ant-mock_claude_thermo"
KIMI_API_KEY = "mock_kimi_nuclear"
UX_PILOT_KEY = "mock_ux_thermo"
BUDGET_PER_TASK = "0.10"