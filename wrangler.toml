
name = "backend-thermo"
main = "backend/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
# JWT_SECRET must be set as a Cloudflare Workers secret
# Use: wrangler secret put JWT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "protothrive-db"
database_id = "mock_d1_thermo"
